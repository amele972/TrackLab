[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracklab"
version = "1.0.0"
description = "Nuclear track detector analysis for multiple ions in CR-39"
readme = "README.md"
authors = [
    { name = "TrackLab Team" }
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "matplotlib>=3.5",
    "pandas>=1.4",
    "PyQt6>=6.4",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pre-commit>=3.0",
    "ruff>=0.1.0",
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=1.0",
    "pyinstaller>=6.0",
]

[project.scripts]
tracklab = "tracklab.main:main"

[project.gui-scripts]
tracklab-gui = "tracklab.gui:launch"

[tool.setuptools]
packages = ["tracklab", "tracklab.gui"]

[tool.setuptools.package-data]
tracklab = ["data/*.dat", "data/*.xlsx"]

[tool.ruff]
line-length = 88
exclude = [".git", "__pycache__", "build", "dist", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F401", "F841"]
